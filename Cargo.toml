[package]
name = "mergetopus"
version = "0.6.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1"
anstream = "1.0"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
owo-colors = "4"
ratatui = "0.30"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
thiserror = "2"
base64 = "0.22"

[build-dependencies]
serde_json = "1"
