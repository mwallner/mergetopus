[package]
name = "mergetopus"
version = "0.6.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1"
anstream = { version = "1.0", optional = true }
clap = { version = "4", features = ["derive"], optional = true }
crossterm = { version = "0.29", optional = true }
owo-colors = "4"
ratatui = { version = "0.30", optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
thiserror = "2"
base64 = "0.22"

[features]
default = ["tui", "cli"]
# Terminal UI stack. biggit depends on this crate with
# `default-features = false` and must never pull these in.
tui = ["dep:ratatui", "dep:crossterm"]
# Command-line front end (the `mergetopus` binary).
cli = ["dep:clap", "dep:anstream"]

[lib]
name = "mergetopus"
path = "src/lib.rs"

[[bin]]
name = "mergetopus"
path = "src/main.rs"
required-features = ["cli", "tui"]

[build-dependencies]
serde_json = "1"
